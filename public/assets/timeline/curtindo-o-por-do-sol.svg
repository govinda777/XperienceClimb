<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2545" />
      <stop offset="35%" stop-color="#8A3E4B" />
      <stop offset="65%" stop-color="#D96B43" />
      <stop offset="90%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="60%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="mantiqueiraFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B3A5A" />
      <stop offset="100%" stop-color="#4A2035" />
    </linearGradient>
    <linearGradient id="mantiqueiraMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F2538" />
      <stop offset="100%" stop-color="#251622" />
    </linearGradient>
  </defs>

  <!-- Ceu em Degrade Crepuscular da Mantiqueira -->
  <rect width="320" height="220" rx="16" fill="url(#sunsetSky)" />

  <!-- Raios Solares Radiantes -->
  <g stroke="#FFE8A3" stroke-width="1" opacity="0.35">
    <line x1="160" y1="120" x2="60" y2="20" stroke-dasharray="3 3" />
    <line x1="160" y1="120" x2="110" y2="10" stroke-dasharray="4 4" />
    <line x1="160" y1="120" x2="160" y2="5" stroke-dasharray="3 3" />
    <line x1="160" y1="120" x2="210" y2="10" stroke-dasharray="4 4" />
    <line x1="160" y1="120" x2="260" y2="20" stroke-dasharray="3 3" />
  </g>

  <!-- O Sol Dourado Poente -->
  <circle cx="160" cy="115" r="42" fill="url(#sunGlow)" />
  <circle cx="160" cy="115" r="54" fill="#FFB703" opacity="0.25" />

  <!-- Nuvens Crepusculares -->
  <path d="M 30 75 Q 80 70 120 75 Q 160 80 210 74 Q 260 70 290 75" stroke="#FFE0B2" stroke-width="3.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 70 98 Q 120 94 170 98 Q 220 102 260 97" stroke="#FFE0B2" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- Camadas da Serra da Mantiqueira -->
  <path d="M 0 135 Q 40 122 90 128 Q 140 134 180 124 Q 225 116 265 125 Q 295 130 320 128 L 320 220 L 0 220 Z" fill="url(#mantiqueiraFar)" />
  <path d="M 0 152 Q 55 142 110 148 Q 170 155 220 144 Q 270 136 320 148 L 320 220 L 0 220 Z" fill="url(#mantiqueiraMid)" />

  <!-- Plataforma Rochosa do Cume -->
  <path d="M 0 178 L 75 168 L 130 174 L 190 166 L 245 170 L 320 162 L 320 220 L 0 220 Z" fill="#12161A" />
  <path d="M 0 178 L 75 168 L 130 174 L 190 166 L 245 170 L 320 162" stroke="#F4A261" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Amigo 1 (Sentado com pernas balancando) -->
  <g transform="translate(195, 142)">
    <circle cx="12" cy="0" r="4.5" fill="#12161A" />
    <path d="M 7 -1 L 18 -1" stroke="#12161A" stroke-width="2" stroke-linecap="round" />
    <path d="M 12 4 L 12 18 L 8 26" stroke="#12161A" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 12 8 L -2 6 L -16 2" stroke="#12161A" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 8 24 L 8 36 L 14 38" stroke="#12161A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Amigo 2 (Sentado ao lado) -->
  <g transform="translate(222, 144)">
    <circle cx="10" cy="0" r="4.5" fill="#12161A" />
    <path d="M 10 4 L 10 18" stroke="#12161A" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 10 9 L 18 16 L 14 24" stroke="#12161A" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 10 18 L 18 20 L 16 32" stroke="#12161A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Mochila de Trekking -->
  <path d="M 244 154 C 244 148, 252 148, 252 154 L 253 167 L 243 167 Z" fill="#12161A" />

  <!-- Andorinhas em V -->
  <g stroke="#FFE0B2" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 80 48 Q 84 44 88 48 Q 92 44 96 48" />
    <path d="M 102 38 Q 105 35 108 38 Q 111 35 114 38" />
    <path d="M 92 60 Q 95 57 98 60 Q 101 57 104 60" />
  </g>

  <!-- Tag de Altitude -->
  <g transform="translate(18, 24)">
    <rect width="90" height="22" rx="6" fill="#12161A" opacity="0.85" />
    <text x="45" y="15" fill="#FFB703" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">CUME · 1.100m</text>
  </g>
</svg>
